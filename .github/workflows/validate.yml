name: Validate WR Investe

on:
  workflow_dispatch:
  pull_request:
    branches: [main, "feat/**"]
  push:
    branches: [main, "feat/**", "integration/**"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint application files
        run: 'npx eslint src/routes/index.tsx src/routes/carteira.tsx src/routes/investimentos.tsx src/routes/fundos.tsx src/routes/patrimonio.tsx src/hooks/usePortfolio.ts src/hooks/useTrackedInvestments.ts src/hooks/useQuotes.ts src/lib/quotes.server.ts src/lib/quotes.types.ts src/lib/exportPdf.ts src/data/fiis.ts src/components/BottomNav.tsx --rule "prettier/prettier: off"'

      - name: Production build
        run: npm run build
