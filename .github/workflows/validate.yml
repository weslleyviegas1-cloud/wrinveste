name: Validate WR Investe

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint changed application files
        run: npx eslint src/routes/fundos.tsx src/hooks/useQuotes.ts src/lib/quotes.server.ts src/lib/quotes.types.ts src/data/fiis.ts src/components/BottomNav.tsx

      - name: Production build
        run: npm run build
